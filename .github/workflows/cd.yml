name: CD - Azure App Service

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  id-token: write

env:
  AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  ASPNETCORE_ENVIRONMENT: Production

jobs:
  deploy:
    name: Deploy em produção
    # PRs também executam CI, mas nunca podem promover seu artifact para produção.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Baixar artefato aprovado pela CI
        uses: actions/download-artifact@v4
        with:
          name: minimal-api-${{ github.event.workflow_run.head_sha }}
          path: publish
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Autenticar no Azure com OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Configurar ambiente e banco no App Service
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          app-settings-json: |
            [
              { "name": "ASPNETCORE_ENVIRONMENT", "value": "${{ env.ASPNETCORE_ENVIRONMENT }}", "slotSetting": false },
              { "name": "Database__ConnectionString", "value": "${{ secrets.DATABASE_CONNECTION }}", "slotSetting": false }
            ]
      - name: Publicar no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: publish
      - name: Confirmar deploy
        run: echo "✔ Deploy realizado"
      - name: Health Check
        shell: bash
        run: |
          health_url="https://${AZURE_WEBAPP_NAME}.azurewebsites.net/health"
          echo "Executando Health Check em ${health_url}"
          for attempt in {1..6}; do
            status_code=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --max-time 20 "${health_url}" || true)
            if [ "${status_code}" = "200" ]; then
              echo "✔ Health Check executado: HTTP 200"
              exit 0
            fi
            echo "Tentativa ${attempt}/6 retornou HTTP ${status_code:-sem resposta}. Aguardando a aplicação iniciar..."
            sleep 10
          done
          echo "::error::Health Check falhou. O endpoint ${health_url} não retornou HTTP 200 após o deploy."
          exit 1
